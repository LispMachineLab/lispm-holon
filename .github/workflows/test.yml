name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ['30.1', '31.1']
    steps:
      - uses: actions/checkout@v7
      # The editor's agents this adds to, from lispm-agent.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-agent
          path: .deps/lispm-agent
      # LispM Kit, whose engine translates the agent's words.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-kit
          path: .deps/lispm-kit
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Test
        run: make test compile LISPM_AGENT=.deps/lispm-agent/lisp LISPM_KIT=.deps/lispm-kit
